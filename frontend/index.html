<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olympia</title>
    <style>
      body {
        background-color: #fafafa;
        color: #111827;
        opacity: 0;
        transition: opacity 0.2s ease-in-out;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script>
      window.tailwind = window.tailwind || {};
      window.tailwind.config = {
        corePlugins: { preflight: false },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        document.body.classList.add("ready");
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      :root {
        --paper: #fafafa;
        --ink: #171717;
        --scarlet: #dc2626;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--paper);
        color: var(--ink);
        font-family: Outfit, system-ui, sans-serif;
      }

      .is-hidden {
        display: none !important;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes fade-in-up {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes ring-wave {
        0%,
        100% {
          opacity: 0.22;
        }
        50% {
          opacity: 1;
        }
      }

      .bubble-enter {
        animation: fade-in-up 0.45s ease-out both;
      }

      @keyframes gradient-breathe {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }

      .animate-breathe {
        background-size: 200% 200%;
        animation: gradient-breathe 8s ease infinite;
      }

      @keyframes shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      .ai-shimmer-bg {
        background: linear-gradient(
          90deg,
          rgba(254, 242, 242, 0.4) 25%,
          rgba(254, 226, 226, 0.8) 50%,
          rgba(254, 242, 242, 0.4) 75%
        );
        background-size: 200% 100%;
        animation: shimmer 2s infinite linear;
      }

      .olympic-rings circle {
        fill: none;
        stroke-width: 3;
        animation: ring-wave 1.85s ease-in-out infinite;
      }

      .olympic-rings circle:nth-child(1) {
        animation-delay: 0s;
      }
      .olympic-rings circle:nth-child(2) {
        animation-delay: 0.2s;
      }
      .olympic-rings circle:nth-child(3) {
        animation-delay: 0.4s;
      }
      .olympic-rings circle:nth-child(4) {
        animation-delay: 0.6s;
      }
      .olympic-rings circle:nth-child(5) {
        animation-delay: 0.8s;
      }

      .olympia-md p {
        margin: 0 0 0.85rem;
        line-height: 1.75;
      }
      .olympia-md p:last-child {
        margin-bottom: 0;
      }
      .olympia-md ul,
      .olympia-md ol {
        margin: 0.4rem 0 0.9rem 1.15rem;
        display: grid;
        gap: 0.35rem;
      }
      .olympia-md ul {
        list-style: disc;
      }
      .olympia-md strong {
        color: #9f1239;
        font-weight: 600;
      }
      .olympia-md h2,
      .olympia-md h3 {
        font-family: "Cormorant Garamond", Georgia, serif;
        margin: 0.2rem 0 0.7rem;
        letter-spacing: -0.02em;
      }

      .app-shell {
        display: flex;
        height: 100vh;
        position: relative;
        z-index: 1;
      }

      .sidebar {
        width: 4.5rem;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.65rem;
        padding: 1.25rem 0.75rem;
        border-right: 1px solid rgba(23, 23, 23, 0.08);
        background: transparent;
      }

      .sidebar-btn {
        width: 2.75rem;
        height: 2.75rem;
        border: 0;
        border-radius: 1rem;
        background: transparent;
        color: rgba(23, 23, 23, 0.55);
        cursor: pointer;
        transition: background 0.2s ease, color 0.2s ease;
      }

      .sidebar-btn:hover {
        background: rgba(220, 38, 38, 0.06);
        color: #b91c1c;
      }

      .chat-column {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        max-width: 52rem;
        margin: 0 auto;
        width: 100%;
        padding: 0 1.25rem 1.25rem;
      }

      .chat-stage {
        position: relative;
        flex: 1;
        min-height: 0;
      }

      #welcome-screen {
        position: relative;
        z-index: 2;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        overflow: hidden;
        text-align: center;
        pointer-events: none;
      }

      #dynamic-slogan {
        transition: opacity 0.6s ease;
      }

      #dynamic-slogan.is-fading {
        opacity: 0;
      }

      #chat-history {
        position: absolute;
        inset: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 1.15rem;
        padding: 1.25rem 0 1.5rem;
        scroll-behavior: smooth;
      }

      #chat-input {
        flex: 1;
        border: 0;
        background: transparent;
        color: var(--ink);
        font: inherit;
        outline: none;
        resize: none;
        min-height: 1.5rem;
        max-height: 7rem;
        padding: 0.15rem 0.35rem;
      }

      .icon-ghost {
        width: 2.4rem;
        height: 2.4rem;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: rgba(23, 23, 23, 0.45);
        cursor: default;
      }

      #chat-input::placeholder {
        color: #a3a3a3;
      }
    </style>
  </head>
  <body class="relative h-screen overflow-hidden bg-[#FAFAFA] text-neutral-900 antialiased">
    <div class="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
      <div class="absolute -left-16 top-8 h-96 w-96 rounded-full bg-red-600/5 blur-[100px]"></div>
      <div class="absolute -right-12 top-1/3 h-96 w-96 rounded-full bg-red-600/5 blur-[100px]"></div>
      <div class="absolute bottom-0 left-1/3 h-96 w-96 rounded-full bg-red-600/5 blur-[100px]"></div>
    </div>

    <div class="app-shell">
      <aside class="sidebar" aria-label="Navigation">
        <svg
          class="mb-2 h-8 w-12 text-red-600"
          viewBox="0 0 88 54"
          fill="none"
          role="img"
          aria-label="Anneaux olympiques"
        >
          <circle cx="20" cy="18" r="14" fill="none" stroke="currentColor" stroke-width="2.2" />
          <circle cx="44" cy="18" r="14" fill="none" stroke="currentColor" stroke-width="2.2" />
          <circle cx="68" cy="18" r="14" fill="none" stroke="currentColor" stroke-width="2.2" />
          <circle cx="32" cy="32" r="14" fill="none" stroke="currentColor" stroke-width="2.2" />
          <circle cx="56" cy="32" r="14" fill="none" stroke="currentColor" stroke-width="2.2" />
        </svg>
        <button type="button" class="sidebar-btn" title="Nouveau chat" aria-label="Nouveau chat">
          <i class="fa-solid fa-plus"></i>
        </button>
        <button type="button" class="sidebar-btn" title="Historique" aria-label="Historique">
          <i class="fa-regular fa-clock"></i>
        </button>
        <div class="mt-auto">
          <button type="button" class="sidebar-btn" title="Paramètres" aria-label="Paramètres">
            <i class="fa-solid fa-gear"></i>
          </button>
        </div>
      </aside>

      <div class="chat-column">
        <header class="flex items-end justify-between py-5">
          <div>
            <p class="text-[0.65rem] uppercase tracking-[0.32em] text-red-600">Préparation physique</p>
            <h1
              class="font-display text-4xl italic text-neutral-900"
              style="font-family: 'Cormorant Garamond', Georgia, serif"
            >
              Olympia
            </h1>
          </div>
        </header>

        <div class="chat-stage">
          <div id="welcome-screen">
            <div
              class="absolute inset-0 -z-10 scale-150 rounded-full bg-gradient-to-br from-red-100/50 via-white/10 to-red-50/50 blur-3xl animate-breathe"
              aria-hidden="true"
            ></div>
            <h2
              class="relative max-w-xl text-4xl italic leading-tight text-neutral-900 sm:text-5xl"
              style="font-family: 'Cormorant Garamond', Georgia, serif"
            >
              Bonjour. Prêt pour l'excellence ?
            </h2>
            <p id="dynamic-slogan" class="relative mt-5 text-lg font-light tracking-wide text-neutral-500">
              La discipline bat le talent.
            </p>
          </div>
          <main id="chat-history" aria-live="polite" aria-label="Historique de conversation"></main>
        </div>

        <div
          id="loading-indicator"
          class="is-hidden mb-3 flex justify-center"
          role="status"
          aria-label="Olympia réfléchit"
          aria-hidden="true"
        >
          <div
            class="flex items-center gap-3 rounded-2xl border border-red-100 bg-white/80 px-4 py-2 shadow-sm backdrop-blur-md"
          >
            <svg class="olympic-rings h-10 w-24" viewBox="0 0 220 108" fill="none" aria-hidden="true">
              <circle cx="46" cy="42" r="30" stroke="#7f1d1d" />
              <circle cx="110" cy="42" r="30" stroke="#dc2626" />
              <circle cx="174" cy="42" r="30" stroke="#f87171" />
              <circle cx="78" cy="72" r="30" stroke="#b91c1c" />
              <circle cx="142" cy="72" r="30" stroke="#991b1b" />
            </svg>
            <span class="text-xs text-neutral-500">Olympia analyse…</span>
          </div>
        </div>

        <form id="chat-form" class="mx-auto w-full max-w-3xl">
          <div
            class="flex items-center gap-2 rounded-full border border-gray-200 bg-white px-2 py-1.5 shadow-lg"
          >
            <button type="button" class="icon-ghost" title="Pièce jointe" aria-label="Pièce jointe">
              <i class="fa-solid fa-paperclip"></i>
            </button>
            <label for="chat-input" class="sr-only">Votre message</label>
            <textarea
              id="chat-input"
              name="message"
              rows="1"
              maxlength="4000"
              required
              placeholder="Demandez à Olympia…"
            ></textarea>
            <button type="button" class="icon-ghost" title="Voix" aria-label="Voix">
              <i class="fa-solid fa-microphone"></i>
            </button>
            <button
              id="chat-submit"
              type="submit"
              class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-gradient-to-br from-red-600 to-red-800 text-white transition hover:shadow-[0_0_15px_rgba(220,38,38,0.5)] disabled:opacity-40"
              aria-label="Envoyer"
            >
              <i class="fa-solid fa-arrow-up"></i>
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js" defer></script>
    <script src="/app.js" defer></script>
  </body>
</html>
